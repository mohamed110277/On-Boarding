<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>داش بورد المناديب</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7690;--bd:#e3e8f2;--pr:#3b6cf6;--ok:#16a34a;--bad:#dc2626;--wn:#f59e0b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#182031;--tx:#e8ecf5;--mu:#94a0ba;--bd:#26304a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",Arial,sans-serif;padding:16px}
.wrap{max-width:1200px;margin:auto}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
h1{font-size:22px;margin:0}
.mu{color:var(--mu);font-size:13px}
button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:28px;margin-top:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.row .l{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .bar{flex:1;height:14px;background:var(--bd);border-radius:7px;overflow:hidden}
.row .bar i{display:block;height:100%;background:var(--pr);border-radius:7px}
.row .n{width:28px;text-align:left;color:var(--mu)}
.days{display:flex;gap:8px;align-items:flex-end;height:150px}
.day{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px}
.stack{width:70%;display:flex;flex-direction:column-reverse;border-radius:6px;overflow:hidden;min-height:2px}
.stack i{display:block}
.legend{display:flex;gap:12px;font-size:12px;margin-top:8px;color:var(--mu)}
.legend s{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;text-decoration:none}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
input,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{color:var(--mu);font-weight:600}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}
.online{background:var(--ok)}.offline{background:var(--bad)}.hold{background:var(--wn)}.other{background:var(--mu)}
#err{color:var(--bad);display:none;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>📊 داش بورد المناديب</h1><div class="mu" id="upd">جاري التحميل...</div></div>
  <button onclick="load()">🔄 تحديث</button>
</header>
<div id="err"></div>
<div class="kpis" id="kpis"></div>
<div class="grid">
  <div class="card"><h2>الحالة اليومية (آخر الأيام)</h2><div class="days" id="days"></div>
    <div class="legend"><span><s style="background:var(--ok)"></s>Active</span><span><s style="background:var(--wn)"></s>Absent</span><span><s style="background:var(--bad)"></s>Left</span></div></div>
  <div class="card"><h2>توزيع الحالة</h2><div id="status"></div></div>
  <div class="card"><h2>المناديب حسب الـ Hub</h2><div id="hub"></div></div>
  <div class="card"><h2>المناديب حسب الـ Contractor</h2><div id="con"></div></div>
  <div class="card"><h2>أسباب الترك</h2><div id="reason"></div></div>
</div>
<div class="card">
  <h2>كل المناديب</h2>
  <div class="tools">
    <input id="q" placeholder="بحث بالاسم / ID / Hub..." oninput="renderTable()">
    <select id="fs" onchange="renderTable()"></select>
  </div>
  <div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
</div>
</div>
<script>
const URL_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vT3jd7lA_7IVnf4dswY4MG1OvwlSbhb_cxkf_DeHsxXJSN_i7GDOaEME684Q4tp_aug1R4y3fY4Y5j0/pub?output=csv";
let rows=[],dayCols=[];
const $=id=>document.getElementById(id);
function parseCSV(t){const r=[];let c=[],f="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch=='"')q=true;
    else if(ch==','){c.push(f);f=""}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;c.push(f);r.push(c);c=[];f=""}
    else f+=ch}
  if(f||c.length){c.push(f);r.push(c)}return r}
function cnt(arr,key){const m={};arr.forEach(x=>{const k=(x[key]||"").trim()||"—";m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
function bars(id,data){const mx=Math.max(1,...data.map(d=>d[1]));
  $(id).innerHTML=data.length?data.map(([k,v])=>`<div class="row"><span class="l" title="${k}">${k}</span><span class="bar"><i style="width:${v/mx*100}%"></i></span><span class="n">${v}</span></div>`).join(""):'<span class="mu">لا توجد بيانات</span>'}
async function load(){
  $("err").style.display="none";
  try{
    const res=await fetch(URL_CSV+"&t="+Date.now());
    if(!res.ok)throw new Error(res.status);
    const t=await res.text();
    const data=parseCSV(t).filter(r=>r.some(x=>x.trim()));
    const head=data[0].map(h=>h.trim());
    dayCols=head.map((h,i)=>/^\d{1,2} [A-Za-z]{3}$/.test(h)?i:-1).filter(i=>i>=0);
    rows=data.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]||"").replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,"").trim());o._d=dayCols.map(i=>(r[i]||"").trim());o._h=head;return o});
    window._head=head;
    render();
    $("upd").textContent="آخر تحديث: "+new Date().toLocaleTimeString("ar-EG")+" • بيتحدّث تلقائياً كل دقيقة";
  }catch(e){
    $("err").style.display="block";
    $("err").textContent="تعذر تحميل الشيت ("+e.message+"). تأكد إن الشيت Published وإنك فاتح الملف من جهازك أو من موقع مستضاف.";
  }
}
function render(){
  const by=s=>rows.filter(r=>r.Status.toLowerCase()===s).length;
  const left=rows.filter(r=>r["Last day of work"]).length;
  const k=[["إجمالي المناديب",rows.length],["Online",by("online")],["Offline",by("offline")],["Hold",by("hold")],["تركوا الشغل",left]];
  $("kpis").innerHTML=k.map(([a,b])=>`<div class="card kpi"><span class="mu">${a}</span><b>${b}</b></div>`).join("");
  // daily
  const dc=dayCols.map((ci,j)=>{const h=window._head[ci];let a=0,b=0,l=0;rows.forEach(r=>{const v=r._d[j];if(v=="Active")a++;else if(v=="Absent")b++;else if(v=="Left")l++});return{h,a,b,l}});
  const mx=Math.max(1,...dc.map(d=>d.a+d.b+d.l));
  $("days").innerHTML=dc.map(d=>{const t=d.a+d.b+d.l,H=t/mx*100;
    return`<div class="day"><span>${t||""}</span><div class="stack" style="height:${H*0.85}%"><i style="background:var(--ok);height:${t?d.a/t*100:0}%"></i><i style="background:var(--wn);height:${t?d.b/t*100:0}%"></i><i style="background:var(--bad);height:${t?d.l/t*100:0}%"></i></div><span class="mu">${d.h}</span></div>`}).join("");
  bars("status",cnt(rows,"Status"));
  bars("hub",cnt(rows,"Hub"));
  bars("con",cnt(rows,"contractor"));
  bars("reason",cnt(rows.filter(r=>r["Reason for left"]),"Reason for left"));
  const cur=$("fs").value;
  $("fs").innerHTML='<option value="">كل الحالات</option>'+cnt(rows,"Status").map(([s])=>`<option${s==cur?" selected":""}>${s}</option>`).join("");
  $("th").innerHTML="<tr>"+["الاسم","Fawry ID","Contractor","Hub","Zone","الحالة","السبب","آخر يوم","تاريخ الانضمام"].map(h=>`<th>${h}</th>`).join("")+"</tr>";
  renderTable();
}
function renderTable(){
  const q=$("q").value.toLowerCase(),s=$("fs").value;
  const list=rows.filter(r=>(!s||r.Status==s)&&(!q||[r["Full Name"],r["Fawry ID"],r["Star ID"],r.Hub,r.Zone,r.contractor].join(" ").toLowerCase().includes(q)));
  $("tb").innerHTML=list.map(r=>{const st=r.Status.toLowerCase();const c=["online","offline","hold"].includes(st)?st:"other";
    return`<tr><td>${r["Full Name"]}</td><td>${r["Fawry ID"]}</td><td>${r.contractor}</td><td>${r.Hub}</td><td>${r.Zone}</td><td><span class="tag ${c}">${r.Status||"—"}</span></td><td>${r["Reason for left"]}</td><td>${r["Last day of work"]}</td><td>${r["Joined Date"]}</td></tr>`}).join("")||'<tr><td colspan="9" class="mu">مفيش نتائج</td></tr>';
}
load();setInterval(load,60000);
</script>
</body>
</html>

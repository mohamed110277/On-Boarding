<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courier onboarding</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2333;--mu:#6b7690;--bd:#e3e8f2;--pr:#3b6cf6;--ok:#16a34a;--bad:#dc2626;--wn:#f59e0b}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--card:#182031;--tx:#e8ecf5;--mu:#94a0ba;--bd:#26304a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;padding:16px}
.wrap{max-width:1200px;margin:auto}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
h1{font-size:22px;margin:0}
.mu{color:var(--mu);font-size:13px}
button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.kpi b{display:block;font-size:28px;margin-top:4px}
h2{font-size:15px;margin:0 0 12px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
input,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:600}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}
.online{background:var(--ok)}.offline{background:var(--bad)}.hold{background:var(--wn)}.other{background:var(--mu)}
#err{color:var(--bad);display:none;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>📊 Courier onboarding</h1><div class="mu" id="upd">Loading...</div></div>
  <button onclick="load()">🔄 Refresh</button>
</header>
<div id="err"></div>
<div class="kpis" id="kpis"></div>
<div class="card">
  <h2>All couriers</h2>
  <div class="tools">
    <input id="q" placeholder="Search by name / ID / Hub..." oninput="renderTable()">
    <select id="fs" onchange="renderTable()"></select>
  </div>
  <div class="tw"><table><thead id="th"></thead><tbody id="tb"></tbody></table></div>
</div>
</div>
<script>
const URL_CSV="https://docs.google.com/spreadsheets/d/e/2PACX-1vT3jd7lA_7IVnf4dswY4MG1OvwlSbhb_cxkf_DeHsxXJSN_i7GDOaEME684Q4tp_aug1R4y3fY4Y5j0/pub?output=csv";
let rows=[];
const $=id=>document.getElementById(id);
function parseCSV(t){const r=[];let c=[],f="",q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch=='"')q=true;
    else if(ch==','){c.push(f);f=""}
    else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;c.push(f);r.push(c);c=[];f=""}
    else f+=ch}
  if(f||c.length){c.push(f);r.push(c)}return r}
function cnt(arr,key){const m={};arr.forEach(x=>{const k=(x[key]||"").trim();if(k)m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
async function load(){
  $("err").style.display="none";
  try{
    const res=await fetch(URL_CSV+"&t="+Date.now());
    if(!res.ok)throw new Error(res.status);
    const t=await res.text();
    const data=parseCSV(t).filter(r=>r.some(x=>x.trim()));
    const head=data[0].map(h=>h.trim());
    rows=data.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]||"").replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g,"").trim());return o})
      .filter(r=>r["Full Name"]); // count only rows that actually contain courier data
    render();
    $("upd").textContent="Last updated: "+new Date().toLocaleTimeString("en-US")+" • auto-refreshes every minute";
  }catch(e){
    $("err").style.display="block";
    $("err").textContent="Could not load the sheet ("+e.message+"). Make sure the sheet is published and the file is opened from your device or a hosted site.";
  }
}
function render(){
  const by=s=>rows.filter(r=>r.Status.toLowerCase()===s).length;
  const left=rows.filter(r=>r["Last day of work"]).length;
  const k=[["Total couriers",rows.length],["Online",by("online")],["Offline",by("offline")],["Hold",by("hold")],["Left",left]];
  $("kpis").innerHTML=k.map(([a,b])=>`<div class="card kpi"><span class="mu">${a}</span><b>${b}</b></div>`).join("");
  const cur=$("fs").value;
  $("fs").innerHTML='<option value="">All statuses</option>'+cnt(rows,"Status").map(([s])=>`<option${s==cur?" selected":""}>${s}</option>`).join("");
  $("th").innerHTML="<tr>"+["Name","Fawry ID","Contractor","Hub","Zone","Status","Reason","Last day","Joined date"].map(h=>`<th>${h}</th>`).join("")+"</tr>";
  renderTable();
}
function renderTable(){
  const q=$("q").value.toLowerCase(),s=$("fs").value;
  const list=rows.filter(r=>(!s||r.Status==s)&&(!q||[r["Full Name"],r["Fawry ID"],r["Star ID"],r.Hub,r.Zone,r.contractor].join(" ").toLowerCase().includes(q)));
  $("tb").innerHTML=list.map(r=>{const st=r.Status.toLowerCase();const c=["online","offline","hold"].includes(st)?st:"other";
    return`<tr><td>${r["Full Name"]}</td><td>${r["Fawry ID"]}</td><td>${r.contractor}</td><td>${r.Hub}</td><td>${r.Zone}</td><td><span class="tag ${c}">${r.Status||"—"}</span></td><td>${r["Reason for left"]}</td><td>${r["Last day of work"]}</td><td>${r["Joined Date"]}</td></tr>`}).join("")||'<tr><td colspan="9" class="mu">No results</td></tr>';
}
load();setInterval(load,60000);
</script>
</body>
</html>
